<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Open-mic stage with microphone, stool, notebook and coffee">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241019"/>
      <stop offset=".45" stop-color="#431a24"/>
      <stop offset="1" stop-color="#150b12"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".2" r=".72">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#ffc27c" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff8a52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a221c"/>
      <stop offset="1" stop-color="#180e0c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#82502f"/>
      <stop offset=".5" stop-color="#a86a3f"/>
      <stop offset="1" stop-color="#6d3f26"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#back)"/>
